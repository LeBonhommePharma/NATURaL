name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Submission assets and Swift core
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify submission configuration
        run: python3 scripts/validate-submission.py
      - name: Verify website language routing
        run: node scripts/test-site-language.cjs
      - name: Test Swift core (acceleration remains opt-in)
        run: swift test --package-path BonhommeCore --jobs 4

  release-build:
    name: iOS and embedded watchOS release build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify SDK floor
        run: |
          xcodebuild -version
          python3 -c 'import subprocess; major=int(subprocess.check_output(["xcrun", "--sdk", "iphoneos", "--show-sdk-version"],text=True).split(".")[0]); assert major >= 26, "App Store builds require iOS SDK 26 or later"'
      - name: Build distributable platforms without signing
        run: |
          set -o pipefail
          xcodebuild build \
            -project NATURaL.xcodeproj \
            -scheme Bonhomme \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/ci \
            CODE_SIGNING_ALLOWED=NO | tee build-release.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-build-log
          path: build-release.log

  simulator-tests:
    name: App behavior and accessible free-session journeys
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          devices = [d for runtime, values in runtimes.items() if "iOS" in runtime for d in values if "iPhone" in d["name"]]
          assert devices, "No iPhone simulator installed"
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("NATURAL_TEST_SIMULATOR=" + devices[-1]["udid"] + "\n")
          PYTHON
      - name: Run app and UI regression tests
        run: |
          set -o pipefail
          xcodebuild test -project NATURaL.xcodeproj -scheme Bonhomme \
            -configuration Debug -destination "platform=iOS Simulator,id=$NATURAL_TEST_SIMULATOR" \
            -parallel-testing-enabled NO -resultBundlePath build/ui-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee simulator-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-test-results
          path: |
            simulator-tests.log
            build/ui-tests.xcresult
