name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Linux product contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shannon, privacy, HUD, and icon contracts
        run: python3 scripts/test_contracts.py

  validate:
    name: Submission assets and Swift core
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify submission configuration
        run: python3 scripts/validate-submission.py --include-macos
      - name: Archive validation regression tests
        run: |
          python3 scripts/test_archive_validation.py
          python3 scripts/test_submission_assets.py
          python3 scripts/test_permission_localizations.py
          python3 scripts/test_cloud_signing.py
          python3 scripts/test_localization_inventory.py
          python3 scripts/localization_inventory.py --check-resources
      - name: Verify website language routing
        run: node scripts/test-site-language.cjs
      - name: Product contracts (also run on Linux)
        run: python3 scripts/test_contracts.py
      - name: Test Swift core (acceleration remains opt-in)
        run: swift test --package-path BonhommeCore --jobs 4

  release-build:
    name: iOS and embedded watchOS release build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify SDK floor
        run: |
          xcodebuild -version
          python3 -c 'import subprocess; major=int(subprocess.check_output(["xcrun", "--sdk", "iphoneos", "--show-sdk-version"],text=True).split(".")[0]); assert major >= 26, "App Store builds require iOS SDK 26 or later"'
      - name: Build distributable platforms without signing
        run: |
          set -o pipefail
          xcodebuild build \
            -project NATURaL.xcodeproj \
            -scheme Bonhomme \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/ci \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-release.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-build-log
          path: build-release.log

  simulator-tests:
    name: App behavior and accessible journeys (${{ matrix.device }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4
      - name: Select a native screenshot simulator
        env:
          DEVICE_FAMILY: ${{ matrix.device }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          family = os.environ["DEVICE_FAMILY"]
          devices = [(runtime, d) for runtime, values in runtimes.items() if "iOS" in runtime for d in values if family in d["name"]]
          assert devices, f"No {family} simulator installed"
          def preference(item):
              runtime, device = item
              version = tuple(int(v) for v in runtime.split("iOS-")[-1].split("-"))
              large = "Pro Max" in device["name"] if family == "iPhone" else "13-inch" in device["name"]
              return (large, version, device["name"])
          runtime, device = max(devices, key=preference)
          os.makedirs("build", exist_ok=True)
          with open("build/simulator.json", "w") as receipt:
              json.dump({"runtime": runtime, "device": device, "commit": os.environ["GITHUB_SHA"]}, receipt, indent=2)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("NATURAL_TEST_SIMULATOR=" + device["udid"] + "\n")
          print(f"Selected {device['name']} on {runtime}")
          PYTHON
      - name: Run app and UI regression tests
        run: |
          set -o pipefail
          xcodebuild test -project NATURaL.xcodeproj -scheme Bonhomme \
            -configuration Debug -destination "platform=iOS Simulator,id=$NATURAL_TEST_SIMULATOR" \
            -parallel-testing-enabled NO -resultBundlePath build/ui-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee simulator-tests.log
      - name: Export actual XCTest screenshots
        if: always()
        run: |
          if [[ -d build/ui-tests.xcresult ]]; then
            xcrun xcresulttool export attachments --path build/ui-tests.xcresult --output-path build/ui-screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-screenshots-${{ matrix.device }}
          path: |
            build/ui-screenshots
            build/simulator.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-test-results-${{ matrix.device }}
          path: |
            simulator-tests.log
            build/ui-tests.xcresult

  macos-build:
    name: Native macOS release build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build native Mac app without distribution signing
        run: |
          set -o pipefail
          xcodebuild build -project NATURaL.xcodeproj -scheme BonhommeMac \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build/mac-ci CODE_SIGNING_ALLOWED=NO 2>&1 | tee macos-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-build-log
          path: macos-build.log

  tvos-build:
    name: Native tvOS release build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record selected Xcode and tvOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-version
      - name: Build Apple TV app without distribution signing
        run: |
          set -o pipefail
          xcodebuild build -project NATURaL.xcodeproj -scheme BonhommeTV \
            -configuration Release -destination 'generic/platform=tvOS' \
            -derivedDataPath build/tv-ci CODE_SIGNING_ALLOWED=NO 2>&1 | tee tvos-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tvos-build-log
          path: tvos-build.log
